name: Build browser hoop detector

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-hoop-detector.yml"
      - "tools/export_ebard_hoop.py"

permissions:
  contents: write

jobs:
  export-hoop-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Hoop Central
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics==8.3.0 huggingface_hub==0.27.1 onnx==1.16.1

      - name: Export the published E-BARD checkpoint to ONNX
        run: python tools/export_ebard_hoop.py

      - name: Commit the browser model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ebard-hoop.onnx models/ebard-hoop.json
          if git diff --cached --quiet; then
            echo "The exported model is already up to date."
          else
            git commit -m "Add browser-ready E-BARD hoop detector"
            git push origin HEAD:main
          fi
